<!-- Navigation Buttons -->
<div class="nav-buttons" id="navButtons" style="position: fixed; bottom: 100px; left: 20px; z-index: 999; display: flex; gap: 10px; cursor: move;">
    <button class="nav-btn" onclick="window.history.back()" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; backdrop-filter: blur(5px);">
        <i class="fas fa-chevron-left"></i>
    </button>
    <button class="nav-btn" onclick="window.history.forward()" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; backdrop-filter: blur(5px);">
        <i class="fas fa-chevron-right"></i>
    </button>
</div>

<script>
// Make setLanguage available globally
window.setLanguage = function(lang) {
    localStorage.setItem('appLanguage', lang);
    if (typeof applyTranslations === 'function') {
        applyTranslations();
    }
};

// Initialize language selector with saved preference
document.addEventListener('DOMContentLoaded', function() {
    const langSelect = document.getElementById('languageSelect');
    if (langSelect) {
        const savedLang = localStorage.getItem('appLanguage') || 'en';
        langSelect.value = savedLang;
    }
    
    // Apply translations if function exists
    if (typeof applyTranslations === 'function') {
        applyTranslations();
    }
});

// Make navigation buttons draggable
const navButtons = document.getElementById('navButtons');
let isDragging = false;
let offsetX, offsetY;

navButtons.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('nav-btn')) return;
    isDragging = true;
    offsetX = e.clientX - navButtons.offsetLeft;
    offsetY = e.clientY - navButtons.offsetTop;
    navButtons.style.cursor = 'grabbing';
});

document.addEventListener('mousemove', (e) => {
    if (isDragging) {
        e.preventDefault();
        navButtons.style.left = (e.clientX - offsetX) + 'px';
        navButtons.style.top = (e.clientY - offsetY) + 'px';
    }
});

document.addEventListener('mouseup', () => {
    if (isDragging) {
        isDragging = false;
        navButtons.style.cursor = 'move';
        
        // Save position
        const pos = {
            left: navButtons.style.left,
            top: navButtons.style.top
        };
        localStorage.setItem('navButtonsPos', JSON.stringify(pos));
    }
});

// Restore saved position
const savedPos = localStorage.getItem('navButtonsPos');
if (savedPos) {
    try {
        const pos = JSON.parse(savedPos);
        navButtons.style.left = pos.left;
        navButtons.style.top = pos.top;
    } catch (e) {
        console.log('Could not restore nav buttons position');
    }
}
</script>
