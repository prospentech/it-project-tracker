<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="firebase-config.js"></script>
    <script type="import" src="firebase-service.js"></script>

    <!-- Make your other scripts type="module" -->
    <script type="module" src="../auth.js"></script>
    <script type="module" src="../projects.js"></script>
    <script type="module" src="../updates.js"></script>
    <script type="module" src="../clocking.js"></script>
    <script type="module" src="../chatbot.js"></script>
    <script type="module" src="../modal.js"></script>
    <script type="module" src="../theme.js"></script>
    <script type="module" src="../stats.js"></script>
    <script type="module" src="../tasks.js"></script>
    <script type="module" src="../main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="stats-header">
            <h1><i class="fas fa-users-cog"></i> User Management</h1>
            <div class="stats-controls">
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <i class="fas fa-chevron-left"></i> Back to Dashboard
                </button>
            </div>
        </div>

        <div class="section-box">
            <h2>System Users</h2>
            <div id="usersContainer">
                <!-- Users will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Chatbot Container -->
    <div id="chatbot-container"></div>

    <script type="module">
        import auth from '../auth.js';
        import firebaseService from '../firebase-service.js';

        // Check authentication - only admin can access
        const currentUser = auth.getCurrentUser();
        if (!currentUser || currentUser.username !== 'admin') {
            window.location.href = '../index.html';
        }

        // Make functions available globally for onclick handlers
        window.resetUserPassword = async function(uid) {
            const newPassword = prompt('Enter new password for user:');
            if (!newPassword) return;

            const result = await firebaseService.resetUserPassword(uid, newPassword);
            
            if (result.success) {
                alert('Password reset successfully!');
            } else {
                alert('Failed to reset password: ' + result.error);
            }
        };

        window.viewUserTasks = function(username) {
            window.location.href = `tasks.html?user=${username}`;
        };

        async function loadUsers() {
            try {
                const users = await firebaseService.getAllUsers();
                const container = document.getElementById('usersContainer');
                
                if (users.length === 0) {
                    container.innerHTML = '<p>No users found</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                users.forEach(user => {
                    const isOnline = user.online ? 'Online' : 'Offline';
                    const statusColor = user.online ? 'success' : 'text-p';
                    
                    html += `
                        <tr>
                            <td><strong>${user.username}</strong></td>
                            <td>${user.fullName || user.username}</td>
                            <td>${user.email || 'N/A'}</td>
                            <td>${user.role || 'Team Member'}</td>
                            <td><span style="color: var(--${statusColor});"><i class="fas fa-circle" style="font-size: 0.6rem;"></i> ${isOnline}</span></td>
                            <td>
                                <button class="small-btn" onclick="resetUserPassword('${user.uid}')" title="Reset Password">
                                    <i class="fas fa-key"></i>
                                </button>
                                <button class="small-btn" onclick="viewUserTasks('${user.username}')" title="View Tasks">
                                    <i class="fas fa-tasks"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersContainer').innerHTML = '<p>Error loading users. Please try again.</p>';
            }
        }

        // Load chatbot component
        async function loadChatbot() {
            try {
                const chatbotResponse = await fetch('../components/chatbot.html');
                const chatbotHTML = await chatbotResponse.text();
                document.getElementById('chatbot-container').innerHTML = chatbotHTML;
                
                // Initialize chatbot
                if (window.initChatbot) {
                    setTimeout(window.initChatbot, 500);
                }
            } catch (error) {
                console.error('Error loading chatbot:', error);
            }
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadChatbot(); // Load chatbot
            loadUsers(); // Load users
        });
    </script>
</body>
</html>
