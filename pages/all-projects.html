<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="firebase-config.js"></script>
    <script type="import" src="firebase-service.js"></script>

    <!-- Make your other scripts type="module" -->
    <script type="module" src="../auth.js"></script>
    <script type="module" src="../projects.js"></script>
    <script type="module" src="../updates.js"></script>
    <script type="module" src="../clocking.js"></script>
    <script type="module" src="../chatbot.js"></script>
    <script type="module" src="../modal.js"></script>
    <script type="module" src="../theme.js"></script>
    <script type="module" src="../stats.js"></script>
    <!-- <script type="module" src="../tasks.js"></script> -->
    <script type="module" src="../main.js"></script>
    <script type="module" src="../i18n.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--accent-glow);
        }
        
        .stat-card .stat-icon {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-h);
        }
        
        .stat-card .stat-label {
            color: var(--text-p);
            font-size: 0.9rem;
        }
        
        .projects-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 15px;
            overflow: hidden;
        }
        
        .projects-table th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        .projects-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .projects-table tr:hover {
            background: rgba(255,255,255,0.02);
        }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-badge.in-progress {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
        }
        
        .status-badge.completed {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        
        .status-badge.pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .status-badge.on-hold {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-h);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        .action-btn.delete:hover {
            background: var(--danger);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .pagination-btn {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-h);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .pagination-btn:hover,
        .pagination-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination-btn:disabled:hover {
            background: var(--card);
            color: var(--text-h);
            border-color: rgba(255,255,255,0.1);
        }
        
        .project-detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px;
            box-sizing: border-box;
        }
        
        .project-detail-view.show {
            display: block;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }
        
        .detail-section {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .detail-section h2 {
            color: var(--accent);
            margin-top: 0;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .detail-section h2 i {
            font-size: 1.2rem;
        }
        
        .detail-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .detail-label {
            color: var(--accent);
            font-weight: 600;
        }
        
        .detail-value {
            color: var(--text-h);
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
        }
        
        .team-member {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        
        .team-member b {
            color: var(--accent);
            display: block;
            margin-bottom: 5px;
        }
        
        .team-member i {
            font-size: 0.8rem;
            color: var(--text-p);
        }
        
        .task-item {
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        
        .task-item .task-priority {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            color: white;
            display: inline-block;
            margin-left: 5px;
        }
        
        .priority-high { background: #ef4444; }
        .priority-medium { background: #f59e0b; }
        .priority-low { background: #94a3b8; }
        
        .budget-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .budget-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .budget-item .label {
            color: var(--text-p);
            font-size: 0.8rem;
        }
        
        .budget-item .value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .budget-item.total .value { color: var(--accent); }
        .budget-item.spent .value { color: var(--danger); }
        .budget-item.remaining .value { color: var(--success); }

        /* Fix custom modal sizing */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .custom-modal {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .custom-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 1;
            border-radius: 15px 15px 0 0;
        }

        .custom-modal-header h3 {
            margin: 0;
            color: var(--accent);
        }

        .custom-modal-close {
            background: none;
            border: none;
            color: var(--text-h);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .custom-modal-close:hover {
            color: var(--danger);
        }

        .custom-modal-body {
            padding: 20px 25px;
            flex: 1;
        }

        .custom-modal-footer {
            padding: 15px 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            position: sticky;
            bottom: 0;
            background: var(--card);
            border-radius: 0 0 15px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-header">
            <h1><i class="fas fa-project-diagram"></i> All Projects</h1>
            <div class="stats-controls">
                <button class="control-btn" onclick="openProjectModal()">
                    <i class="fas fa-plus"></i> New Project
                </button>
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <i class="fas fa-chevron-left"></i> Back to Dashboard
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-cards" id="statsCards"></div>

        <!-- Projects Table -->
        <div class="section-box">
            <h2>All Projects</h2>
            <div style="overflow-x: auto;">
                <table class="projects-table" id="projectsTable">
                    <thead>
                        <tr>
                            <th>Project ID</th>
                            <th>Project Name</th>
                            <th>Lead</th>
                            <th>Status</th>
                            <th>Due Date</th>
                            <th>Progress</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectsTableBody">
                        <!-- Projects will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Project Detail View -->
    <div id="projectDetailView" class="project-detail-view">
        <button class="back-btn" onclick="closeProjectDetail()">
            <i class="fas fa-chevron-left"></i> BACK TO PROJECTS
        </button>
        <div id="projectDetailContent"></div>
    </div>

    <!-- Project Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Project</h2>
                <button class="close-btn" onclick="closeProjectModal()">&times;</button>
            </div>
            <form id="projectForm" onsubmit="saveProject(event)">
                <input type="hidden" id="projectId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="projectName">Project Name *</label>
                        <input type="text" id="projectName" required>
                    </div>
                    <div class="form-group">
                        <label for="projectIcon">Icon Class (FontAwesome)</label>
                        <input type="text" id="projectIcon" placeholder="fas fa-chart-line" value="fas fa-project-diagram">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="projectLead">Project Lead *</label>
                        <input type="text" id="projectLead" required>
                    </div>
                    <div class="form-group">
                        <label for="projectStatus">Status *</label>
                        <select id="projectStatus" required>
                            <option value="In Progress">In Progress</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="On Hold">On Hold</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="projectDesc">Description *</label>
                    <textarea id="projectDesc" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="projectStart">Start Date *</label>
                        <input type="date" id="projectStart" required>
                    </div>
                    <div class="form-group">
                        <label for="projectDue">Due Date *</label>
                        <input type="date" id="projectDue" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="projectType">Project Type *</label>
                    <select id="projectType" required>
                        <option value="">Select Type</option>
                        <option value="Design">Design (Email Banners, Brochures e.t.c)</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Web Design">Web Design</option>
                        <option value="Moodle LMS">Moodle LMS</option>
                        <option value="Video Editing">Video Editing</option>
                        <option value="eLearning Website">eLearning Website</option>
                        <option value="Presentation Design">Presentation Design</option>
                        <option value="Landing Page">Landing Pages</option>
                        <option value="Digital Marketing">Digital Marketing</option>
                        <option value="Technical Support">Technical Support</option>
                        <option value="Research & Testing">Research & Testing</option>
                        <option value="Client Support">Client Support</option>
                        <option value="HubSpot CRM">HubSpot CRM</option>
                        <option value="Zoho CRM">Zoho CRM</option>
                        <option value="Venue Setup">Venue Setup</option>
                        <option value="Microsoft 365">Microsoft 365</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Team Members</label>
                    <div id="teamMembersContainer">
                        <!-- Team members will be added here -->
                    </div>
                    <button type="button" class="btn-secondary" onclick="addTeamMember()" style="margin-top: 10px;">
                        <i class="fas fa-plus"></i> Add Team Member
                    </button>
                </div>

                <div class="form-group">
                    <label>Tasks</label>
                    <div id="tasksContainer">
                        <!-- Tasks will be added here -->
                    </div>
                    <button type="button" class="btn-secondary" onclick="addTask()" style="margin-top: 10px;">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>

                <div class="form-group">
                    <label for="projectNotes">Notes</label>
                    <textarea id="projectNotes"></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="closeProjectModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Chatbot Container -->
    <div id="chatbot-container"></div>

    <script type="module">
        import auth from '../auth.js';
        import firebaseService from '../firebase-service.js';
        import { openProjectModal, closeProjectModal, saveProject, addTeamMember, addTask, formatDate, calculateTotalBudget, calculateSpentBudget, openBudgetModal, saveBudgetItem } from '../projects.js';

        // Check authentication
        const currentUser = auth.getCurrentUser();
        if (!currentUser) {
            window.location.href = '../login.html';
        }

        let projects = {};
        let projectsList = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        // Make functions available globally
        window.openProjectModal = openProjectModal;
        window.closeProjectModal = closeProjectModal;
        window.saveProject = saveProject;
        window.addTeamMember = addTeamMember;
        window.addTask = addTask;
        window.closeProjectDetail = closeProjectDetail;
        window.openBudgetModal = openBudgetModal;
        window.saveBudgetItem = saveBudgetItem;

        // Override showProjectView so saveBudgetItem refreshes this page's detail view
        window.showProjectView = function(projectId) {
            viewProjectDetails(projectId);
        };

        // Load projects from Firebase
        async function loadProjects() {
            projects = await firebaseService.getProjects();
            projectsList = Object.values(projects);
            
            updateStats();
            renderTable();
        }

        // Update statistics cards
        function updateStats() {
            const now = new Date();
            const totalProjects = projectsList.length;
            const inProgress = projectsList.filter(p => p.status === 'In Progress').length;
            const completed = projectsList.filter(p => p.status === 'Completed').length;
            const pending = projectsList.filter(p => p.status === 'Pending').length;
            const onHold = projectsList.filter(p => p.status === 'On Hold').length;
            
            // Calculate overdue projects
            const overdue = projectsList.filter(p => {
                if (!p.due || p.status === 'Completed') return false;
                const dueDate = new Date(p.due);
                return dueDate < now;
            }).length;
            
            const statsContainer = document.getElementById('statsCards');
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-folder"></i></div>
                    <div class="stat-number">${totalProjects}</div>
                    <div class="stat-label">Total Projects</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-play-circle" style="color: var(--accent);"></i></div>
                    <div class="stat-number">${inProgress}</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-check-circle" style="color: var(--success);"></i></div>
                    <div class="stat-number">${completed}</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-hourglass-half" style="color: var(--warning);"></i></div>
                    <div class="stat-number">${pending}</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-pause-circle" style="color: var(--danger);"></i></div>
                    <div class="stat-number">${onHold}</div>
                    <div class="stat-label">On Hold</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i></div>
                    <div class="stat-number">${overdue}</div>
                    <div class="stat-label">Overdue</div>
                </div>
            `;
        }

        // Calculate project progress
        function calculateProjectProgress(project) {
            if (!project.tasks || project.tasks.length === 0) return 0;
            const completedTasks = project.tasks.filter(t => t.status === 'Completed').length;
            return Math.round((completedTasks / project.tasks.length) * 100);
        }

        // Render table with pagination
        function renderTable() {
            const tbody = document.getElementById('projectsTableBody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedProjects = projectsList.slice(startIndex, endIndex);
            
            if (projectsList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            <i class="fas fa-folder-open fa-4x" style="color: var(--text-p); margin-bottom: 20px;"></i>
                            <p>No projects found. Click "New Project" to create your first project.</p>
                        </td>
                    </tr>
                `;
            } else {
                let html = '';
                paginatedProjects.forEach((project, index) => {
                    const sequentialId = (startIndex + index + 1).toString().padStart(2, '0');
                    const statusClass = {
                        'In Progress': 'in-progress',
                        'Completed': 'completed',
                        'Pending': 'pending',
                        'On Hold': 'on-hold'
                    }[project.status] || 'pending';
                    
                    const progress = calculateProjectProgress(project);
                    const dueDate = project.due ? new Date(project.due) : null;
                    const now = new Date();
                    const isOverdue = dueDate && dueDate < now && project.status !== 'Completed';
                    
                    html += `
                        <tr>
                            <td><strong>${sequentialId}</strong></td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <i class="${project.icon || 'fas fa-project-diagram'}" style="color: var(--accent);"></i>
                                    <strong>${project.name}</strong>
                                </div>
                            </td>
                            <td>${project.lead}</td>
                            <td><span class="status-badge ${statusClass}">${project.status || 'Pending'}</span></td>
                            <td>
                                ${project.due ? new Date(project.due).toLocaleDateString() : 'N/A'}
                                ${isOverdue ? '<br><small style="color: var(--danger);">Overdue</small>' : ''}
                            </td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 5px;">
                                    <span>${progress}%</span>
                                    <div class="progress-bar" style="width: 60px;">
                                        <div class="progress-fill" style="width: ${progress}%;"></div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <button class="action-btn" onclick="viewProjectDetails('${project.id}')" title="View Details">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="action-btn" onclick="editProject('${project.id}')" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="action-btn delete" onclick="deleteProject('${project.id}')" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }
            
            renderPagination();
        }

        // Render pagination controls
        function renderPagination() {
            const totalPages = Math.ceil(projectsList.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = `
                <button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `
                        <button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                            ${i}
                        </button>
                    `;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span class="pagination-btn" style="cursor: default;">...</span>`;
                }
            }
            
            html += `
                <button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;
            
            pagination.innerHTML = html;
        }

        // Change page
        window.changePage = function(page) {
            const totalPages = Math.ceil(projectsList.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        };

        // Edit project
        window.editProject = function(projectId) {
            openProjectModal(projectId);
        };

        // Delete project
        window.deleteProject = function(projectId) {
            const project = projects[projectId];
            
            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal danger">
                    <div class="custom-modal-header">
                        <h3>Confirm Delete</h3>
                        <button class="custom-modal-close" onclick="this.parentElement.parentElement.parentElement.remove()">&times;</button>
                    </div>
                    <div class="custom-modal-body">
                        <p>Are you sure you want to delete project <strong>${project.name}</strong>? This action cannot be undone.</p>
                    </div>
                    <div class="custom-modal-footer">
                        <button class="btn-secondary" onclick="this.parentElement.parentElement.parentElement.remove()">Cancel</button>
                        <button class="btn-primary" style="background: var(--danger);" onclick="confirmDeleteProject('${projectId}')">Delete</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.confirmDeleteProject = async function(projectId) {
            const result = await firebaseService.deleteProject(projectId);
            
            document.querySelector('.custom-modal-overlay').remove();
            
            if (result.success) {
                showCustomModal('Success', 'Project deleted successfully!', 'success');
                await loadProjects();
            } else {
                showCustomModal('Error', 'Failed to delete project: ' + result.error, 'danger');
            }
        };

        // View project details
        window.viewProjectDetails = function(projectId) {
            const project = projects[projectId];
            if (!project) return;
            
            const detailView = document.getElementById('projectDetailView');
            const content = document.getElementById('projectDetailContent');
            
            const totalBudget = calculateTotalBudget(project);
            const spentBudget = calculateSpentBudget(project);
            const remainingBudget = totalBudget - spentBudget;
            const progress = calculateProjectProgress(project);
            
            let html = `
                <div class="grid-layout">
                    <div class="main-col">
                        <div class="detail-section">
                            <h2><i class="fas fa-info-circle"></i> Project Overview</h2>
                            <div class="detail-row"><span class="detail-label">Project Name:</span><span class="detail-value">${project.name}</span></div>
                            <div class="detail-row"><span class="detail-label">Description:</span><span class="detail-value">${project.desc || 'No description'}</span></div>
                            <div class="detail-row"><span class="detail-label">Project Lead:</span><span class="detail-value">${project.lead}</span></div>
                            <div class="detail-row"><span class="detail-label">Type:</span><span class="detail-value">${project.type || 'N/A'}</span></div>
                            <div class="detail-row"><span class="detail-label">Start Date:</span><span class="detail-value">${formatDate(project.start)}</span></div>
                            <div class="detail-row"><span class="detail-label">Due Date:</span><span class="detail-value">${formatDate(project.due)}</span></div>
                            <div class="detail-row"><span class="detail-label">Status:</span><span class="detail-value"><span class="status-badge ${project.status === 'In Progress' ? 'in-progress' : project.status === 'Completed' ? 'completed' : project.status === 'Pending' ? 'pending' : 'on-hold'}">${project.status || 'Pending'}</span></span></div>
                            <div class="detail-row"><span class="detail-label">Progress:</span>
                                <span class="detail-value">
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <span>${progress}%</span>
                                        <div class="progress-bar" style="width: 200px;">
                                            <div class="progress-fill" style="width: ${progress}%;"></div>
                                        </div>
                                    </div>
                                </span>
                            </div>
                            <div class="detail-row"><span class="detail-label">Last Updated:</span><span class="detail-value">${project.lastUpdated ? new Date(project.lastUpdated).toLocaleString() : 'Never'}</span></div>
                            <div class="detail-row"><span class="detail-label">Last Updated By:</span><span class="detail-value">${project.lastUpdatedBy || 'N/A'}</span></div>
                        </div>

                        <div class="detail-section">
                            <h2><i class="fas fa-tasks"></i> Tasks</h2>
                            ${project.tasks && project.tasks.length > 0 ? `
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Task</th>
                                            <th>Assignee</th>
                                            <th>Priority</th>
                                            <th>Due Date</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${project.tasks.map(task => `
                                            <tr>
                                                <td>${task.name}</td>
                                                <td>${task.who}</td>
                                                <td><span class="task-priority priority-${task.prio?.toLowerCase() || 'medium'}">${task.prio || 'Medium'}</span></td>
                                                <td>${formatDate(task.due)}</td>
                                                <td>${task.status}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            ` : '<p>No tasks added yet</p>'}
                        </div>

                        <div class="detail-section">
                            <h2><i class="fas fa-chart-line"></i> Weekly Timeline</h2>
                            ${project.timeline && project.timeline.length > 0 ? `
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Week</th>
                                            <th>Range</th>
                                            <th>Planned</th>
                                            <th>Completed</th>
                                            <th>Risks/Delays</th>
                                            <th>Next Focus</th>
                                            <th>Updated By</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${project.timeline.map(entry => `
                                            <tr>
                                                <td>${entry.wk}</td>
                                                <td>${entry.range}</td>
                                                <td>${entry.planned}</td>
                                                <td>${entry.comp}</td>
                                                <td>${entry.risk || 'None'}</td>
                                                <td>${entry.next || 'N/A'}</td>
                                                <td><strong>${entry.by || 'Unknown'}</strong></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            ` : '<p>No timeline entries added yet</p>'}
                        </div>

                        <div class="detail-section">
                            <h2><i class="fas fa-coins"></i> Budget & Resources</h2>
                            <div class="budget-summary">
                                <div class="budget-item total">
                                    <div class="label">Total Budget</div>
                                    <div class="value">R${totalBudget.toFixed(2)}</div>
                                </div>
                                <div class="budget-item spent">
                                    <div class="label">Spent</div>
                                    <div class="value">R${spentBudget.toFixed(2)}</div>
                                </div>
                                <div class="budget-item remaining">
                                    <div class="label">Remaining</div>
                                    <div class="value">R${remainingBudget.toFixed(2)}</div>
                                </div>
                            </div>
                            
                            ${project.budget && project.budget.items && project.budget.items.length > 0 ? `
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Item</th>
                                            <th>Type</th>
                                            <th>Amount</th>
                                            <th>Spent</th>
                                            <th>Purchase Date</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${project.budget.items.map((item, index) => `
                                            <tr>
                                                <td>${item.name}</td>
                                                <td>${item.type || 'One-time'}</td>
                                                <td>R${(item.amount || 0).toFixed(2)}</td>
                                                <td>R${(item.spent || 0).toFixed(2)}</td>
                                                <td>${item.purchaseDate ? formatDate(item.purchaseDate) : '-'}</td>
                                                <td>
                                                    <div class="action-buttons">
                                                        <button class="action-btn" onclick="editBudgetItem('${project.id}', ${index})" title="Edit">
                                                            <i class="fas fa-edit"></i>
                                                        </button>
                                                        <button class="action-btn delete" onclick="deleteBudgetItem('${project.id}', ${index})" title="Delete">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            ` : '<p>No budget items added yet</p>'}
                            <div style="text-align: right; margin-top: 15px;">
                                <button class="control-btn" onclick="openBudgetModal('${project.id}')" style="padding: 8px 16px;">
                                    <i class="fas fa-plus"></i> Add Budget Item
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="side-col">
                        <div class="detail-section">
                            <h2><i class="fas fa-users"></i> Team Members</h2>
                            ${project.members && project.members.length > 0 ? project.members.map(member => {
                                const systemUsers = [
                                    { username: 'admin', fullName: 'Administrator' },
                                    { username: 'Junior', fullName: 'Junior' },
                                    { username: 'Buhle', fullName: 'Buhle' },
                                    { username: 'AJay', fullName: 'AJay' }
                                ];
                                const memberUsername = member.username || member.name || '';
                                const user = systemUsers.find(u => u.username === memberUsername);
                                const displayName = user ? (user.fullName || user.username) : (memberUsername || 'Unknown');
                                return `
                                <div class="team-member">
                                    <b>${displayName}</b>
                                    <i>${member.role || ''}</i>
                                    <div style="font-size:0.8rem; margin-top:5px;">${member.resp || ''}</div>
                                    <div style="color:var(--accent); font-size:0.8rem;">${member.contact || ''}</div>
                                </div>`;
                            }).join('') : '<p>No team members added yet</p>'}
                        </div>
                        
                        <div class="detail-section">
                            <h2><i class="fas fa-sticky-note"></i> Notes</h2>
                            <p>${project.notes || 'No notes available.'}</p>
                        </div>
                        
                        <div class="detail-section">
                            <h2><i class="fas fa-clock"></i> Quick Actions</h2>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                <button class="control-btn" onclick="editProject('${project.id}')" style="width: 100%;">
                                    <i class="fas fa-edit"></i> Edit Project
                                </button>
                                <button class="control-btn" onclick="window.location.href='tasks.html?project=${project.id}'" style="width: 100%;">
                                    <i class="fas fa-tasks"></i> View Tasks
                                </button>
                                <button class="control-btn" onclick="window.location.href='all-updates.html?project=${project.id}'" style="width: 100%;">
                                    <i class="fas fa-bullhorn"></i> Related Updates
                                </button>
                                <button class="control-btn" style="background: var(--danger); width: 100%;" onclick="deleteProject('${project.id}')">
                                    <i class="fas fa-trash"></i> Delete Project
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            content.innerHTML = html;
            detailView.classList.add('show');
        };

        // Close project detail view
        function closeProjectDetail() {
            document.getElementById('projectDetailView').classList.remove('show');
        }

        // Show custom modal
        function showCustomModal(title, message, type = 'info') {
            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal ${type}">
                    <div class="custom-modal-header">
                        <h3>${title}</h3>
                        <button class="custom-modal-close" onclick="this.parentElement.parentElement.parentElement.remove()">&times;</button>
                    </div>
                    <div class="custom-modal-body">
                        <p>${message}</p>
                    </div>
                    <div class="custom-modal-footer">
                        <button class="btn-primary" onclick="this.parentElement.parentElement.parentElement.remove()">OK</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Edit budget item
        window.editBudgetItem = function(projectId, index) {
            const project = projects[projectId];
            if (!project || !project.budget || !project.budget.items) return;
            const item = project.budget.items[index];

            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal" style="max-width: 500px;">
                    <div class="custom-modal-header">
                        <h3>Edit Budget Item</h3>
                        <button class="custom-modal-close" onclick="this.closest('.custom-modal-overlay').remove()">&times;</button>
                    </div>
                    <div class="custom-modal-body">
                        <form id="editBudgetForm">
                            <div class="form-group">
                                <label for="editBudgetName">Item Name *</label>
                                <input type="text" id="editBudgetName" value="${item.name || ''}" required>
                            </div>
                            <div class="form-group">
                                <label for="editBudgetType">Payment Type *</label>
                                <select id="editBudgetType" required>
                                    <option value="One-time" ${(item.type || 'One-time') === 'One-time' ? 'selected' : ''}>One-time Purchase</option>
                                    <option value="Monthly" ${item.type === 'Monthly' ? 'selected' : ''}>Monthly Subscription</option>
                                    <option value="Quarterly" ${item.type === 'Quarterly' ? 'selected' : ''}>Quarterly</option>
                                    <option value="Annual" ${item.type === 'Annual' ? 'selected' : ''}>Annual</option>
                                    <option value="Hourly" ${item.type === 'Hourly' ? 'selected' : ''}>Hourly Rate</option>
                                    <option value="Project" ${item.type === 'Project' ? 'selected' : ''}>Project Based</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="editBudgetAmount">Total Amount (R) *</label>
                                    <input type="number" id="editBudgetAmount" value="${item.amount || 0}" min="0" step="0.01" required>
                                </div>
                                <div class="form-group">
                                    <label for="editBudgetSpent">Amount Spent (R) *</label>
                                    <input type="number" id="editBudgetSpent" value="${item.spent || 0}" min="0" step="0.01" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="editBudgetDate">Purchase Date *</label>
                                <input type="date" id="editBudgetDate" value="${item.purchaseDate || ''}" required>
                            </div>
                            <div class="form-group">
                                <label for="editBudgetReceipt">Receipt URL (optional)</label>
                                <input type="url" id="editBudgetReceipt" value="${item.receipt || ''}" placeholder="https://drive.google.com/...">
                                <small style="color: var(--text-p); display: block; margin-top: 5px;">Link to receipt in Google Drive, Dropbox, etc.</small>
                            </div>
                            <div class="form-group">
                                <label for="editBudgetNotes">Notes (optional)</label>
                                <textarea id="editBudgetNotes" rows="2" placeholder="Additional details about this expense...">${item.notes || ''}</textarea>
                            </div>
                            <div class="btn-group">
                                <button type="button" class="btn-secondary" onclick="this.closest('.custom-modal-overlay').remove()">Cancel</button>
                                <button type="button" class="btn-primary" onclick="saveEditedBudgetItem('${projectId}', ${index})">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        // Save edited budget item
        window.saveEditedBudgetItem = async function(projectId, index) {
            const project = projects[projectId];
            if (!project || !project.budget || !project.budget.items) return;

            project.budget.items[index] = {
                name: document.getElementById('editBudgetName').value,
                type: document.getElementById('editBudgetType').value,
                amount: parseFloat(document.getElementById('editBudgetAmount').value),
                spent: parseFloat(document.getElementById('editBudgetSpent').value),
                purchaseDate: document.getElementById('editBudgetDate').value,
                receipt: document.getElementById('editBudgetReceipt').value || null,
                notes: document.getElementById('editBudgetNotes').value || null
            };

            await firebaseService.saveProject(project);
            localStorage.setItem('prospenProjects', JSON.stringify(projects));

            document.querySelector('.custom-modal-overlay').remove();
            viewProjectDetails(projectId);
            showCustomModal('Success', 'Budget item updated successfully!', 'success');
        };

        // Delete budget item
        window.deleteBudgetItem = function(projectId, index) {
            const project = projects[projectId];
            if (!project || !project.budget || !project.budget.items) return;
            const item = project.budget.items[index];

            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
                <div class="custom-modal danger" style="max-width: 450px;">
                    <div class="custom-modal-header">
                        <h3>Delete Budget Item</h3>
                        <button class="custom-modal-close" onclick="this.closest('.custom-modal-overlay').remove()">&times;</button>
                    </div>
                    <div class="custom-modal-body">
                        <p>Are you sure you want to delete <strong>${item.name}</strong>? This action cannot be undone.</p>
                    </div>
                    <div class="custom-modal-footer">
                        <button class="btn-secondary" onclick="this.closest('.custom-modal-overlay').remove()">Cancel</button>
                        <button class="btn-primary" style="background: var(--danger);" onclick="confirmDeleteBudgetItem('${projectId}', ${index})">Delete</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        // Confirm delete budget item
        window.confirmDeleteBudgetItem = async function(projectId, index) {
            const project = projects[projectId];
            if (!project || !project.budget || !project.budget.items) return;

            project.budget.items.splice(index, 1);

            await firebaseService.saveProject(project);
            localStorage.setItem('prospenProjects', JSON.stringify(projects));

            document.querySelector('.custom-modal-overlay').remove();
            viewProjectDetails(projectId);
            showCustomModal('Success', 'Budget item deleted successfully!', 'success');
        };

        // Load chatbot component
        async function loadChatbot() {
            try {
                const chatbotResponse = await fetch('../components/chatbot.html');
                const chatbotHTML = await chatbotResponse.text();
                document.getElementById('chatbot-container').innerHTML = chatbotHTML;
                
                // Initialize chatbot
                if (window.initChatbot) {
                    setTimeout(window.initChatbot, 500);
                }
            } catch (error) {
                console.error('Error loading chatbot:', error);
            }
        }

        // Subscribe to real-time updates
        firebaseService.subscribeToProjects((updatedProjects) => {
            projects = updatedProjects;
            projectsList = Object.values(projects);
            updateStats();
            renderTable();
        });

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadChatbot();
            loadProjects();
            
            // Check if we need to open a project view (from localStorage)
            const projectId = localStorage.getItem('currentProjectView');
            if (projectId) {
                setTimeout(() => {
                    viewProjectDetails(projectId);
                    localStorage.removeItem('currentProjectView');
                }, 100);
            }
        });
    </script>
</body>
</html>
