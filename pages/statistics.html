<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="firebase-config.js"></script>
    <script type="import" src="firebase-service.js"></script>

    <!-- Make your other scripts type="module" -->
    <script type="module" src="/auth.js"></script>
    <script type="module" src="/projects.js"></script>
    <script type="module" src="/updates.js"></script>
    <script type="module" src="/clocking.js"></script>
    <script type="module" src="/chatbot.js"></script>
    <script type="module" src="/modal.js"></script>
    <script type="module" src="/theme.js"></script>
    <script type="module" src="/stats.js"></script>
    <script type="module" src="/main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="stats-header">
            <h1>
                <i class="fas fa-chart-pie"></i> System Statistics & History
                <span class="realtime-badge">LIVE</span>
            </h1>
            <div class="stats-controls">
                <button class="export-btn" onclick="exportStats()">
                    <i class="fas fa-download"></i> Export Data
                </button>
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <i class="fas fa-chevron-left"></i> Back to Dashboard
                </button>
            </div>
        </div>
        
        <div id="statsContainer">
            <!-- Stats will be loaded here -->
        </div>
    </div>

    <script>
        // Check authentication
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = '../login.html';
        }
        
        function exportStats() {
            const activities = statsSystem.getActivities();
            const sessions = statsSystem.getSessions();
            const projects = JSON.parse(localStorage.getItem('prospenProjects')) || {};
            const updates = JSON.parse(localStorage.getItem('prospenUpdates')) || [];
            const enquiries = JSON.parse(localStorage.getItem('prospenEnquiries')) || [];
            const profiles = JSON.parse(localStorage.getItem('prospenProfiles')) || {};
            
            const data = {
                exportDate: new Date().toISOString(),
                exportedBy: currentUser.username,
                activities: activities,
                sessions: sessions,
                currentUser: currentUser,
                projects: projects,
                updates: updates,
                profiles: profiles,
                enquiries: enquiries
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `prospen-stats-${new Date().toISOString().split('T')[0]}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
        
        // Load stats
        document.addEventListener('DOMContentLoaded', function() {
            if (window.updateStatsDisplay) {
                window.updateStatsDisplay();
            }
            
            // Update stats every 30 seconds
            setInterval(() => {
                if (window.updateStatsDisplay) {
                    window.updateStatsDisplay();
                }
            }, 30000);
        });
    </script>
</body>
</html>
