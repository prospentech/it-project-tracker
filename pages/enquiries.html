<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="firebase-config.js"></script>
    <script type="import" src="firebase-service.js"></script>

    <!-- Make your other scripts type="module" -->
    <script type="module" src="../auth.js"></script>
    <script type="module" src="../projects.js"></script>
    <script type="module" src="../updates.js"></script>
    <script type="module" src="../clocking.js"></script>
    <script type="module" src="../chatbot.js"></script>
    <script type="module" src="../modal.js"></script>
    <script type="module" src="../theme.js"></script>
    <script type="module" src="../stats.js"></script>
    <script type="module" src="../main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="stats-header">
            <h1><i class="fas fa-lightbulb"></i> Suggestions Management</h1>
            <div class="stats-controls">
                <button class="export-btn" onclick="exportSuggestions()">
                    <i class="fas fa-download"></i> Export Suggestions
                </button>
                <button class="control-btn" onclick="markAllSuggestionsRead()">
                    <i class="fas fa-check-double"></i> Mark All Read
                </button>
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <i class="fas fa-chevron-left"></i> Back to Dashboard
                </button>
            </div>
        </div>

        <div class="section-box">
            <h2>All Suggestions</h2>
            <div id="enquiriesContainer">
                <!-- Suggestions will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = '../login.html';
        }

        async function loadSuggestions() {
            const { default: firebaseService } = await import('../firebase-service.js');
            const suggestions = await firebaseService.getEnquiries();
            const container = document.getElementById('enquiriesContainer');
            
            // Filter only suggestions (or all if no type)
            const filteredSuggestions = suggestions.filter(s => s.type === 'suggestion' || !s.type);
            
            if (filteredSuggestions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <i class="fas fa-lightbulb fa-4x" style="color: var(--text-p); margin-bottom: 20px;"></i>
                        <h3 style="color: var(--text-p);">No suggestions yet</h3>
                        <p style="color: var(--text-p);">All suggestions submitted through the NEXA chatbot will appear here.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filteredSuggestions.forEach(suggestion => {
                const date = new Date(suggestion.timestamp);
                const language = suggestion.language ? ` (${suggestion.language.charAt(0).toUpperCase() + suggestion.language.slice(1)})` : '';
                
                html += `
                    <div class="enquiry-card ${suggestion.read ? 'read' : 'unread'}">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                            <div>
                                <h3 style="margin: 0 0 5px 0;">${suggestion.name}${language}</h3>
                                <small style="color: var(--text-p);">${date.toLocaleString()}</small>
                                ${!suggestion.read ? '<span style="background: var(--accent); color: var(--bg); padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-left: 10px;">NEW</span>' : ''}
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button onclick="markSuggestionRead('${suggestion.id}')" class="small-btn" title="Mark as read">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button onclick="replyToSuggestion('${suggestion.id}', '${suggestion.email}')" class="small-btn" title="Reply" style="background: var(--success);">
                                    <i class="fas fa-reply"></i>
                                </button>
                                <button onclick="deleteSuggestion('${suggestion.id}')" class="small-btn" title="Delete" style="background: var(--danger);">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <p><strong><i class="fas fa-envelope"></i> Email:</strong> ${suggestion.email}</p>
                            <p><strong><i class="fas fa-lightbulb"></i> Suggestion:</strong></p>
                            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin-top: 5px;">
                                ${suggestion.suggestion || suggestion.enquiry}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function markSuggestionRead(id) {
            markEnquiryRead(id);
        }

        function markAllSuggestionsRead() {
            markAllEnquiriesRead();
        }

        function replyToSuggestion(id, email) {
            window.location.href = `mailto:${email}?subject=Re: Your suggestion to Prospen Hub`;
        }

        function deleteSuggestion(id) {
            if (confirm('Are you sure you want to delete this suggestion?')) {
                deleteEnquiry(id);
            }
        }

        function exportSuggestions() {
            exportEnquiries();
        }

        document.addEventListener('DOMContentLoaded', loadSuggestions);
    </script>
</body>
</html>
