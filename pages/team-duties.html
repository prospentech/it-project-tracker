<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Duties - Business Operations Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="../firebase-config.js"></script>
    <script type="import" src="../firebase-service.js"></script>

    <script type="module" src="../auth.js"></script>
    <script type="module" src="../projects.js"></script>
    <script type="module" src="../updates.js"></script>
    <script type="module" src="../clocking.js"></script>
    <script type="module" src="../chatbot.js"></script>
    <script type="module" src="../modal.js"></script>
    <script type="module" src="../theme.js"></script>
    <script type="module" src="../stats.js"></script>
    <script type="module" src="../tasks.js"></script>
    <script type="module" src="../team-duties.js"></script>
    <script type="module" src="../main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Team Duties Page Specific Styles */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--accent-glow);
        }
        
        .stat-card .stat-icon {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-h);
        }
        
        .stat-card .stat-label {
            color: var(--text-p);
            font-size: 0.9rem;
        }
        
        .duties-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .duties-table th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .duties-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }
        
        .duties-table tr {
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .duties-table tr:hover {
            background: rgba(255,255,255,0.02);
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-badge.active {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        
        .status-badge.inactive {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .small-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-h);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }
        
        .small-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        .small-btn[style*="danger"]:hover {
            background: var(--danger);
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .kpi-card {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid var(--accent);
        }
        
        .kpi-card h4 {
            color: var(--accent);
            margin: 0 0 10px 0;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-p);
        }
        
        .stat-item .value {
            font-weight: bold;
            color: var(--text-h);
        }
        
        .alert-item {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--danger);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        
        .alert-item.warning {
            background: rgba(245, 158, 11, 0.1);
            border-left-color: var(--warning);
        }
        
        .alert-item .title {
            font-weight: bold;
            color: var(--text-h);
        }
        
        .alert-item .message {
            font-size: 0.9rem;
            color: var(--text-p);
            margin-top: 5px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-header h2 {
            color: var(--accent);
            margin: 0;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-p);
        }
        
        .no-data i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-p);
        }
        
        .loading-spinner i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .dashboard-header h1 {
            color: var(--accent);
            margin: 0;
            font-size: 1.8rem;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        .navbar {
            background: var(--card);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        .navbar h2 {
            color: var(--accent);
            margin: 0;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .nav-link {
            color: var(--text-p);
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            color: var(--accent);
            background: rgba(255,255,255,0.05);
        }
        
        .nav-link.active {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .task-detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px;
            box-sizing: border-box;
        }
        
        .task-detail-view.show {
            display: block;
        }
        
        .detail-section {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .detail-section h2 {
            color: var(--accent);
            margin-top: 0;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .detail-section h2 i {
            font-size: 1.2rem;
        }
        
        .detail-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .detail-label {
            color: var(--accent);
            font-weight: 600;
        }
        
        .detail-value {
            color: var(--text-h);
        }
        
        .back-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: #0ea5e9;
        }
        
        .control-btn {
            background: var(--card);
            color: var(--text-h);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        
        .form-section {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }
        
        .form-section h3 {
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 600;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-h);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-h);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .add-task-btn {
            background: var(--card);
            color: var(--text-h);
            border: 1px dashed var(--accent);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .add-task-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            margin: 0;
            color: var(--accent);
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--text-h);
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        
        .close-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .task-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-actions {
            display: flex;
            gap: 5px;
        }
        
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .custom-modal {
            background: var(--card);
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        
        .custom-modal.danger {
            border-left: 4px solid var(--danger);
        }
        
        .custom-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .custom-modal-header h3 {
            margin: 0;
            color: var(--accent);
        }
        
        .custom-modal-close {
            background: none;
            border: none;
            color: var(--text-h);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        
        .custom-modal-close:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .custom-modal-body {
            padding: 20px;
        }
        
        .custom-modal-footer {
            padding: 15px 20px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: right;
        }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }
        
        @media (max-width: 1024px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .dashboard-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .stats-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header will be loaded here -->
    <div id="header-container"></div>

    <div class="dashboard">
        <div class="dashboard-header">
            <h1>Team Duties Dashboard</h1>
            <div>
                <button onclick="openDutyModal()" class="btn-primary">
                    <i class="fas fa-plus"></i> Assign New Duty
                </button>
            </div>
        </div>

        <!-- Performance Dashboard Section -->
        <div class="section-box" style="margin-bottom: 30px;">
            <div class="section-header">
                <h2><i class="fas fa-chart-line"></i> Performance Dashboard</h2>
            </div>
            <div id="performanceDashboard">
                <!-- Performance dashboard will be loaded here -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading performance data...</p>
                </div>
            </div>
        </div>

        <!-- Duties Section -->
        <div class="section-box">
            <div class="section-header">
                <h2><i class="fas fa-tasks"></i> Current Team Duties</h2>
                <button onclick="openDutyModal()" class="control-btn">
                    <i class="fas fa-plus"></i> Add Duty
                </button>
            </div>
            <div id="dutiesContainer">
                <!-- Duties will be loaded here -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading duties...</p>
                </div>
            </div>
        </div>

        <!-- KPIs Section -->
        <div class="section-box" style="margin-top: 30px;">
            <div class="section-header">
                <h2><i class="fas fa-bullseye"></i> Key Performance Indicators</h2>
                <button onclick="openKPIModal()" class="control-btn">
                    <i class="fas fa-plus"></i> Add KPI
                </button>
            </div>
            <div id="kpisContainer">
                <!-- KPIs will be loaded here -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading KPIs...</p>
                </div>
            </div>
        </div>

        <!-- Monthly Trend Chart -->
        <div class="section-box" style="margin-top: 30px;">
            <h2><i class="fas fa-chart-line"></i> Monthly Performance Trend</h2>
            <div id="monthlyTrendChart" style="height: 200px;">
                <!-- Chart will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Duty Detail View -->
    <div id="dutyDetailView" class="task-detail-view">
        <button class="back-btn" onclick="closeDutyDetail()">
            <i class="fas fa-chevron-left"></i> BACK TO DUTIES
        </button>
        <div id="dutyDetailContent"></div>
    </div>

    <!-- KPI Detail View -->
    <div id="kpiDetailView" class="task-detail-view">
        <button class="back-btn" onclick="closeKPIDetail()">
            <i class="fas fa-chevron-left"></i> BACK TO KPIs
        </button>
        <div id="kpiDetailContent"></div>
    </div>

    <!-- Duty Modal (Add/Edit) -->
    <div id="dutyModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="dutyModalTitle">Add New Duty</h2>
                <button class="close-btn" onclick="closeDutyModal()">&times;</button>
            </div>
            <form id="dutyForm" onsubmit="saveDuty(event)">
                <input type="hidden" id="dutyId">
                
                <div class="form-group">
                    <label for="dutyName">Duty Name *</label>
                    <input type="text" id="dutyName" placeholder="e.g., Content Creation, System Maintenance" required>
                </div>

                <div class="form-group">
                    <label for="dutyDescription">Description *</label>
                    <textarea id="dutyDescription" rows="3" placeholder="Describe the duty and its purpose" required></textarea>
                </div>

                <div class="form-group">
                    <label for="dutyAssignedTo">Assigned To *</label>
                    <select id="dutyAssignedTo" required>
                        <option value="">Select User</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dutyPeriod">Period</label>
                        <select id="dutyPeriod">
                            <option value="Ongoing">Ongoing</option>
                            <option value="Daily">Daily</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                            <option value="Quarterly">Quarterly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dutyStatus">Status</label>
                        <select id="dutyStatus">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tasks</label>
                    <div id="dutyTasksContainer">
                        <!-- Tasks will be added here -->
                    </div>
                    <button type="button" class="add-task-btn" onclick="addTaskField()" style="margin-top: 10px;">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="closeDutyModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Duty</button>
                </div>
            </form>
        </div>
    </div>

    <!-- KPI Modal (Add/Edit) -->
    <div id="kpiModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="kpiModalTitle">Add New KPI</h2>
                <button class="close-btn" onclick="closeKPIModal()">&times;</button>
            </div>
            <form id="kpiForm" onsubmit="saveKPI(event)">
                <input type="hidden" id="kpiId">
                
                <div class="form-group">
                    <label for="kpiName">KPI Name *</label>
                    <input type="text" id="kpiName" placeholder="e.g., Task Completion Rate" required>
                </div>

                <div class="form-group">
                    <label for="kpiDescription">Description</label>
                    <textarea id="kpiDescription" rows="2" placeholder="Describe what this KPI measures"></textarea>
                </div>

                <div class="form-group">
                    <label for="kpiAssignedTo">Assigned To *</label>
                    <select id="kpiAssignedTo" required>
                        <option value="">Select User</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="kpiPeriod">Period</label>
                        <select id="kpiPeriod">
                            <option value="Ongoing">Ongoing</option>
                            <option value="Monthly">Monthly</option>
                            <option value="Quarterly">Quarterly</option>
                            <option value="Annual">Annual</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="kpiTargetValue">Target Value</label>
                        <input type="text" id="kpiTargetValue" placeholder="e.g., ≥ 80%">
                    </div>
                </div>

                <div class="form-group">
                    <label for="kpiStatus">Status</label>
                    <select id="kpiStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="closeKPIModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save KPI</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer will be loaded here -->
    <div id="footer-container"></div>

    <!-- Modals will be loaded here -->
    <div id="modals-container"></div>

    <!-- Chatbot Container -->
    <div id="chatbot-container"></div>

    <script type="module">
        import auth from '../auth.js';
        import { 
            initDuties, openDutyModal, closeDutyModal, saveDuty,
            openKPIModal, closeKPIModal, saveKPI, addTaskField,
            viewDutyDetails, viewKPIDetails, closeDutyDetail, closeKPIDetail,
            editDuty, editKPI, deleteDuty, deleteKPI
        } from '../team-duties.js';

        // Make functions available globally
        window.openDutyModal = openDutyModal;
        window.closeDutyModal = closeDutyModal;
        window.saveDuty = saveDuty;
        window.openKPIModal = openKPIModal;
        window.closeKPIModal = closeKPIModal;
        window.saveKPI = saveKPI;
        window.addTaskField = addTaskField;
        window.viewDutyDetails = viewDutyDetails;
        window.viewKPIDetails = viewKPIDetails;
        window.closeDutyDetail = closeDutyDetail;
        window.closeKPIDetail = closeKPIDetail;
        window.editDuty = editDuty;
        window.editKPI = editKPI;
        window.deleteDuty = deleteDuty;
        window.deleteKPI = deleteKPI;

        // Load components
        async function loadComponents() {
            try {
                // Check authentication
                const currentUser = auth.getCurrentUser();
                if (!currentUser) {
                    window.location.href = '../login.html';
                    return;
                }

                // Load header
                const headerResponse = await fetch('../components/header.html');
                document.getElementById('header-container').innerHTML = await headerResponse.text();

                // Load footer
                const footerResponse = await fetch('../components/footer.html');
                document.getElementById('footer-container').innerHTML = await footerResponse.text();

                // Load modals
                const modalsResponse = await fetch('../components/modals.html');
                document.getElementById('modals-container').innerHTML = await modalsResponse.text();

                // Load chatbot
                const chatbotResponse = await fetch('../components/chatbot.html');
                document.getElementById('chatbot-container').innerHTML = await chatbotResponse.text();

                // Apply theme
                if (window.applyTheme) {
                    setTimeout(window.applyTheme, 100);
                }

                // Initialize chatbot
                if (window.initChatbot) {
                    setTimeout(window.initChatbot, 500);
                }

                // Initialize duties
                initDuties();

            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', loadComponents);
    </script>
</body>
</html>
