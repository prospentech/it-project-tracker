<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="../firebase-config.js"></script>
    <script type="import" src="../firebase-service.js"></script>

    <!-- Make your other scripts type="module" -->
    <script type="module" src="../auth.js"></script>
    <script type="module" src="../projects.js"></script>
    <script type="module" src="../updates.js"></script>
    <script type="module" src="../clocking.js"></script>
    <script type="module" src="../chatbot.js"></script>
    <script type="module" src="../modal.js"></script>
    <script type="module" src="../theme.js"></script>
    <script type="module" src="../stats.js"></script>
    <script type="module" src="../tasks.js"></script>
    <script type="module" src="../main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        .status-badge.in-progress {
            background: #f59e0b;
        }
        .status-badge.completed {
            background: #22c55e;
        }
        .status-badge.delayed {
            background: #ef4444;
        }
        .add-task-btn {
            margin-bottom: 20px;
            text-align: right;
        }
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .task-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .task-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--accent-glow);
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .task-id {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.8rem;
        }
        .task-priority {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
        }
        .priority-high {
            background: #ef4444;
        }
        .priority-medium {
            background: #f59e0b;
        }
        .priority-low {
            background: #94a3b8;
        }
        .task-title {
            margin: 10px 0;
            font-size: 1.1rem;
            color: var(--text-h);
        }
        .task-meta {
            font-size: 0.9rem;
            color: var(--text-p);
            margin: 5px 0;
        }
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .task-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }
        .status-not-started {
            background: #94a3b8;
        }
        .status-in-progress {
            background: #f59e0b;
        }
        .status-completed {
            background: #22c55e;
        }
        .status-overdue {
            background: #ef4444;
        }
        .status-on-hold {
            background: #a855f7;
        }
        .task-actions {
            display: flex;
            gap: 5px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-p);
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-header">
            <h1><i class="fas fa-tasks"></i> Daily Tasks</h1>
            <div class="stats-controls">
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <i class="fas fa-chevron-left"></i> Back to Dashboard
                </button>
            </div>
        </div>

        <!-- Add Task Button -->
        <div class="add-task-btn">
            <button class="control-btn" onclick="openTaskModal()">
                <i class="fas fa-plus"></i> Add New Task
            </button>
        </div>

        <div class="section-box">
            <!-- Tasks Summary -->
            <div id="taskSummary" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 30px;">
                <!-- Summary will be loaded here -->
            </div>

            <!-- Tasks Container -->
            <div id="tasksContainer" class="tasks-grid">
                <!-- Tasks will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="taskModalTitle">Add New Task</h2>
                <button class="close-btn" onclick="closeTaskModal()">&times;</button>
            </div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskIdField">
                
                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Describe the task"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskAssignedTo">Assigned To *</label>
                        <select id="taskAssignedTo" required>
                            <option value="">Select User</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskRelatedProject">Related Project</label>
                        <select id="taskRelatedProject">
                            <option value="">None</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDate">Due Date *</label>
                        <input type="date" id="taskDate" required>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority *</label>
                        <select id="taskPriority" required>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStartTime">Start Time</label>
                        <input type="time" id="taskStartTime">
                    </div>
                    <div class="form-group">
                        <label for="taskExpectedEndTime">Expected End Time</label>
                        <input type="time" id="taskExpectedEndTime">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskActualEndTime">Actual End Time</label>
                        <input type="time" id="taskActualEndTime">
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">Status *</label>
                        <select id="taskStatus" required>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="On Hold">On Hold</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskNotes">Notes</label>
                    <textarea id="taskNotes" rows="3" placeholder="Additional notes..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Chatbot Container -->
    <div id="chatbot-container"></div>

    <script type="module">
        import auth from '../auth.js';
        import firebaseService from '../firebase-service.js';
        import { initTasks, renderTasks, openTaskModal, closeTaskModal, saveTask } from '../tasks.js';

        // Make functions available globally
        window.openTaskModal = openTaskModal;
        window.closeTaskModal = closeTaskModal;
        window.saveTask = saveTask;

        // Check authentication
        const currentUser = auth.getCurrentUser();
        if (!currentUser) {
            window.location.href = '../login.html';
        }

        // Load chatbot component
        async function loadChatbot() {
            try {
                const chatbotResponse = await fetch('../components/chatbot.html');
                const chatbotHTML = await chatbotResponse.text();
                document.getElementById('chatbot-container').innerHTML = chatbotHTML;
                
                // Initialize chatbot
                if (window.initChatbot) {
                    setTimeout(window.initChatbot, 500);
                }
            } catch (error) {
                console.error('Error loading chatbot:', error);
            }
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            loadChatbot(); // Load chatbot
            await initTasks(); // Initialize tasks
            renderTasks(); // Render tasks
        });
    </script>
</body>
</html>
