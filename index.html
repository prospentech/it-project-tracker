<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospen IT and Design Project Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="firebase-config.js"></script>
    <script type="import" src="firebase-service.js"></script>

    <!-- Make your other scripts type="module" -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="projects.js"></script>
    <script type="module" src="updates.js"></script>
    <script type="module" src="clocking.js"></script>
    <script type="module" src="chatbot.js"></script>
    <script type="module" src="modal.js"></script>
    <script type="module" src="theme.js"></script>
    <script type="module" src="stats.js"></script>
    <script type="module" src="tasks.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="i18n.js"></script>

    <!-- Navigation Notification System -->
    <script src="navigation-notification.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header will be loaded here -->
    <div id="header-container"></div>

    <div class="container" id="landing">
        <!-- Hero Slider -->
        <div class="hero-slider" id="heroSlider">
            <div class="slide active" id="welcomeSlide">
                <h2>Welcome!</h2>
                <p id="welcomeMessage">Loading your dashboard...</p>
            </div>
            <div class="slide" style="background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);">
                <h2>Chat Support</h2>
                <p>Get instant help with our AI-powered chatbot assistant</p>
            </div>
            <div class="slide-controls">
                <div class="slide-dot active" onclick="goToSlide(0)"></div>
                <div class="slide-dot" onclick="goToSlide(1)"></div>
            </div>
        </div>

        <!-- Quick Actions Section -->
        <div class="quick-actions-section" style="margin-bottom: 40px;">
            <h2 style="color: var(--accent); margin-bottom: 20px;"><i class="fas fa-bolt"></i> Quick Actions</h2>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                <a href="pages/version-board.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-code-branch fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">Version Board</h3>
                </a>
                <a href="pages/tasks.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-tasks fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">View Tasks</h3>
                </a>
                <a href="pages/all-projects.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-project-diagram fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">View Projects</h3>
                </a>
                <a href="pages/all-updates.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-bullhorn fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">View Updates</h3>
                </a>
                <a href="pages/statistics.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-chart-bar fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">Statistics</h3>
                </a>
                <a href="pages/settings.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-cog fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">Settings</h3>
                </a>
                <a href="pages/enquiries.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-lightbulb fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">Suggestions</h3>
                </a>
                <a href="pages/client-projects.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-briefcase fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">ProspenTech Projects</h3>
                </a>
                <!-- Add this card to the Quick Actions grid -->
                <a href="pages/team-duties.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-tasks fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">Team Duties</h3>
                </a>
                <!-- Add this card after the ProspenTech Projects card -->
                <a href="pages/meeting-minutes.html" class="card" style="text-decoration: none; display: block; text-align: center; padding: 20px;">
                    <i class="fas fa-clipboard-list fa-3x" style="color: var(--accent); margin-bottom: 10px;"></i>
                    <h3 style="margin: 0; color: white;">IT Meeting Minutes</h3>
                </a>
            </div>
        </div>

        <div>
            <p><br></p>
        </div>

        <!-- Updates Section -->
        <div class="updates-section">
            <div class="updates-header">
                <h2><i class="fas fa-bullhorn"></i> Updates</h2>
                <button class="control-btn" onclick="openUpdateModal()">
                    <i class="fas fa-plus"></i> Post Update
                </button>
            </div>
            <div class="updates-container" id="updatesContainer">
                <!-- Updates will be loaded here -->
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="pages/all-updates.html" class="view-more-btn">
                    <i class="fas fa-eye"></i> View All Updates
                </a>
            </div>
        </div>
    </div>

    <!-- Footer will be loaded here -->
    <div id="footer-container"></div>

    <!-- Modals will be loaded here -->
    <div id="modals-container"></div>

    <!-- Chatbot will be loaded here -->
    <div id="chatbot-container"></div>

    <script>
        // Load components
        async function loadComponents() {
            try {
                // Check authentication first
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser && !window.location.pathname.includes('login.html')) {
                    window.location.href = 'login.html';
                    return;
                }
                
                // Load header
                const headerResponse = await fetch('./components/header.html');
                document.getElementById('header-container').innerHTML = await headerResponse.text();
                
                // Load footer
                const footerResponse = await fetch('./components/footer.html');
                document.getElementById('footer-container').innerHTML = await footerResponse.text();
                
                // Load modals
                const modalsResponse = await fetch('./components/modals.html');
                document.getElementById('modals-container').innerHTML = await modalsResponse.text();
                
                // Load chatbot
                const chatbotResponse = await fetch('./components/chatbot.html');
                const chatbotHTML = await chatbotResponse.text();
                document.getElementById('chatbot-container').innerHTML = chatbotHTML;
                
                // Initialize the application
                if (window.initApp) {
                    initApp();
                }
                
                // Initialize chatbot
                if (window.initChatbot) {
                    setTimeout(initChatbot, 500);
                }
                
                // Apply theme
                if (window.applyTheme) {
                    setTimeout(applyTheme, 100);
                }
                
                // Initialize updates
                if (window.initUpdates) {
                    initUpdates();
                }
                
                // Initialize projects
                if (window.initProjects) {
                    initProjects();
                }
                
                // Force render projects and updates after components are loaded
                setTimeout(() => {
                    if (window.renderProjects) renderProjects();
                    if (window.loadUpdates) loadUpdates();
                    if (window.updateUserInfo) updateUserInfo();
                    if (window.updateClockDisplay) updateClockDisplay();
                    if (window.updateWelcomeMessage) updateWelcomeMessage();
                    if (window.initHeroSlider) initHeroSlider();
                    if (window.updateEnquiryIndicator) updateEnquiryIndicator();
                    
                    // Check if we need to open a project view
                    const projectId = localStorage.getItem('currentProjectView');
                    if (projectId && window.showProjectView) {
                        window.showProjectView(projectId);
                    }
                }, 300);
                
            } catch (error) {
                console.error('Error loading components:', error);
                // Fallback: try to render even if components fail
                setTimeout(() => {
                    if (window.renderProjects) renderProjects();
                    if (window.loadUpdates) loadUpdates();
                    if (window.updateUserInfo) updateUserInfo();
                    if (window.updateClockDisplay) updateClockDisplay();
                    if (window.updateWelcomeMessage) updateWelcomeMessage();
                }, 500);
                
                // Show error message to user
                const updatesContainer = document.getElementById('updatesContainer');
                const projectGrid = document.getElementById('project-grid');
                
                if (updatesContainer) {
                    updatesContainer.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: var(--text-p);">
                            <i class="fas fa-exclamation-triangle fa-2x" style="margin-bottom: 10px;"></i>
                            <p>Loading updates...</p>
                            <button class="control-btn" onclick="location.reload()">
                                <i class="fas fa-redo"></i> Retry
                            </button>
                        </div>
                    `;
                }
                
                if (projectGrid) {
                    projectGrid.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: var(--text-p);">
                            <i class="fas fa-exclamation-triangle fa-2x" style="margin-bottom: 10px;"></i>
                            <p>Loading projects...</p>
                            <button class="control-btn" onclick="location.reload()">
                                <i class="fas fa-redo"></i> Retry
                            </button>
                        </div>
                    `;
                }
            }
        }
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadComponents);
        } else {
            loadComponents();
        }
        
        // Handle hash changes for project view
        window.addEventListener('hashchange', function() {
            if (window.location.hash === '#project-view') {
                const projectId = localStorage.getItem('currentProjectView');
                if (projectId && window.showProjectView) {
                    window.showProjectView(projectId);
                }
            }
        });
        
        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // Page is visible again, refresh data
                setTimeout(() => {
                    if (window.renderProjects) renderProjects();
                    if (window.loadUpdates) loadUpdates();
                    if (window.updateUserInfo) updateUserInfo();
                    if (window.updateClockDisplay) updateClockDisplay();
                }, 100);
            }
        });
    </script>
</body>
</html>
