<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Add this BEFORE your other scripts -->
    <script type="import" src="firebase-config.js"></script>
    <script type="import" src="firebase-service.js"></script>

    <script type="module" src="auth.js"></script>
    <script type="module" src="projects.js"></script>
    <script type="module" src="updates.js"></script>
    <script type="module" src="clocking.js"></script>
    <script type="module" src="chatbot.js"></script>
    <script type="module" src="modal.js"></script>
    <script type="module" src="theme.js"></script>
    <script type="module" src="stats.js"></script>
    <script type="module" src="tasks.js"></script>
    <script type="module" src="main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --bg: #020617;
            --card: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-p: #94a3b8;
            --text-h: #f1f5f9;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        .light-mode {
            --bg: #f1f5f9;
            --card: #ffffff;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --text-p: #475569;
            --text-h: #0f172a;
            --danger: #dc2626;
            --success: #16a34a;
            --warning: #d97706;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-h);
            margin: 0;
            line-height: 1.6;
            transition: all 0.3s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .login-box {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .login-header p {
            color: var(--text-p);
            font-size: 0.9rem;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .login-form {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-h);
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .login-btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .user-list {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .user-list h3 {
            color: var(--text-p);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .user-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .user-tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .info-note {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.8rem;
            color: var(--text-p);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-note i {
            color: var(--accent);
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .custom-modal {
            background: var(--card);
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .custom-modal.danger {
            border-left: 4px solid var(--danger);
        }

        .custom-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .custom-modal-header h3 {
            margin: 0;
            color: var(--accent);
        }

        .custom-modal-close {
            background: none;
            border: none;
            color: var(--text-h);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .custom-modal-close:hover {
            background: rgba(255,255,255,0.1);
        }

        .custom-modal-body {
            padding: 20px;
        }

        .custom-modal-body p {
            margin: 0;
            color: var(--text-h);
        }

        .custom-modal-footer {
            padding: 15px 20px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: right;
        }

        .custom-modal-footer button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .custom-modal-footer button:hover {
            background: #0ea5e9;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            
            .login-header h1 {
                font-size: 1.8rem;
            }
            
            .user-tags {
                gap: 5px;
            }
            
            .user-tag {
                padding: 4px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>PROSPEN HUB</h1>
                <p>All IT and Design Projects Control Center</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username_field"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username_field" placeholder="Enter username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password_field"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password_field" placeholder="Enter password" required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="user-list">
                <h3>Forgot Password?</h3>
                <h3>Email: Infotech@prospen.co.za</h3>
                
                <div class="info-note">
                    <i class="fas fa-info-circle"></i>
                    NB: This is for internal use only. Product of Prospen Africa @2026
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import auth from './auth.js';
        
        // Apply theme for login page
        const defaultThemeSettings = {
            darkMode: true,
            cardColor: '#1e293b',
            accentColor: '#38bdf8',
            fontFamily: "'Inter', sans-serif"
        };
        
        if (!localStorage.getItem('prospenTheme_default')) {
            localStorage.setItem('prospenTheme_default', JSON.stringify(defaultThemeSettings));
        }
        
        function applyTheme() {
            const theme = JSON.parse(localStorage.getItem('prospenTheme_default')) || defaultThemeSettings;
            
            if (theme.darkMode) {
            document.body.classList.remove('light-mode');
            } else {
            document.body.classList.add('light-mode');
            }
            
            document.documentElement.style.setProperty('--card', theme.cardColor);
            document.documentElement.style.setProperty('--accent', theme.accentColor);
            document.body.style.fontFamily = theme.fontFamily;
        }
        
        applyTheme();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username_field').value.trim();
            const password = document.getElementById('password_field').value.trim();
            
            if (username && password) {
            const result = await auth.login(username, password);
            
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                showCustomModal('Login Failed', result.error || 'Invalid credentials. Use password as shown.', 'danger');
            }
            } else {
            showCustomModal('Invalid Input', 'Please enter username and password', 'danger');
            }
        });

        function showCustomModal(title, message, type = 'danger') {
            const modal = document.createElement('div');
            modal.className = 'custom-modal-overlay';
            modal.innerHTML = `
            <div class="custom-modal ${type}">
                <div class="custom-modal-header">
                <h3>${title}</h3>
                <button class="custom-modal-close" onclick="this.parentElement.parentElement.parentElement.remove()">&times;</button>
                </div>
                <div class="custom-modal-body">
                <p>${message}</p>
                </div>
                <div class="custom-modal-footer">
                <button class="btn-primary" onclick="this.parentElement.parentElement.parentElement.remove()">OK</button>
                </div>
            </div>
            `;
            document.body.appendChild(modal);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username_field').focus();
        });
    </script>
</body>
</html>
