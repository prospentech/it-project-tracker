<div class="chatbot-container">
    <div class="enquiry-indicator" id="enquiryIndicator" style="display: none;">!</div>
    <button class="chatbot-toggle" id="chatbotToggle">
        <i class="fas fa-robot"></i>
    </button>
    <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
            <h3><i class="fas fa-comments"></i> NEXA Enquiry Assistant</h3>
            <button class="chatbot-close" id="chatbotClose">&times;</button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages"></div>
        <div class="chatbot-input-area">
            <input type="text" class="chatbot-input" id="chatbotInput" 
                   placeholder="Type your message..." 
                   onkeypress="handleChatInput(event)">
            <button class="chatbot-send" onclick="sendChatMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
