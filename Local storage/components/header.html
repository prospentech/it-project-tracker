<header>
    <!-- User info -->
    <div class="user-info" id="userInfo">
        Logged in as: <strong id="currentUserName">Guest</strong>
        <span class="session-duration" id="sessionDuration">0 min</span>
        <button class="clock-btn" id="clockBtn" onclick="confirmClockAction()">CLOCK IN</button>
        <span class="clock-status" id="clockStatus"></span>
    </div>
    
    <div class="header-controls">
        <button class="control-btn" onclick="window.location.href='pages/profile.html'">
            <i class="fas fa-user"></i> PROFILE
        </button>
        <button class="control-btn stats-btn" onclick="window.location.href='pages/statistics.html'">
            <i class="fas fa-chart-line"></i> STATS
        </button>
        <button class="control-btn" onclick="window.location.href='pages/settings.html'">
            <i class="fas fa-palette"></i> THEME
        </button>
        <button class="control-btn" onclick="openProjectModal()">
            <i class="fas fa-plus"></i> ADD PROJECT
        </button>
        <button class="control-btn" onclick="toggleDarkMode()">
            <i class="fas fa-moon"></i> MODE
        </button>
        <button class="control-btn" onclick="auth.logout()" style="background: var(--danger);">
            <i class="fas fa-sign-out-alt"></i> LOGOUT
        </button>
    </div>
    <h1>PROSPEN HUB</h1>
    <p>IT & Design Unified Project Tracker 2026</p>
</header>
