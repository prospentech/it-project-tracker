<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects - Prospen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Additional styles for project view in all-projects page */
        #project-view {
            position: relative;
            display: none;
            margin-top: 20px;
        }
        
        #project-view.show {
            display: block;
        }
        
        .back-to-grid {
            margin-bottom: 20px;
        }
        
        .project-grid.hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-header">
            <h1><i class="fas fa-project-diagram"></i> All Projects</h1>
            <div class="stats-controls">
                <button class="control-btn" onclick="openProjectModal()">
                    <i class="fas fa-plus"></i> New Project
                </button>
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <i class="fas fa-chevron-left"></i> Back to Dashboard
                </button>
            </div>
        </div>
        
        <div class="section-box" id="projectsSection">
            <h2>Project Directory</h2>
            <div class="project-grid" id="allProjectsContainer">
                <!-- All projects will be loaded here -->
            </div>
        </div>

        <!-- Project View Container (hidden initially) -->
        <div id="project-view">
            <button class="back-btn back-to-grid" onclick="closeProjectView()">
                <i class="fas fa-chevron-left"></i> BACK TO PROJECTS
            </button>
            <div id="project-content"></div>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Project</h2>
                <button class="close-btn" onclick="closeProjectModal()">&times;</button>
            </div>
            <form id="projectForm" onsubmit="saveProject(event)">
                <input type="hidden" id="projectId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="projectName">Project Name *</label>
                        <input type="text" id="projectName" required>
                    </div>
                    <div class="form-group">
                        <label for="projectIcon">Icon Class (FontAwesome)</label>
                        <input type="text" id="projectIcon" placeholder="fas fa-chart-line" value="fas fa-project-diagram">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="projectLead">Project Lead *</label>
                        <input type="text" id="projectLead" required>
                    </div>
                    <div class="form-group">
                        <label for="projectStatus">Status *</label>
                        <select id="projectStatus" required>
                            <option value="In Progress">In Progress</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="On Hold">On Hold</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="projectDesc">Description *</label>
                    <textarea id="projectDesc" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="projectStart">Start Date *</label>
                        <input type="date" id="projectStart" required>
                    </div>
                    <div class="form-group">
                        <label for="projectDue">Due Date *</label>
                        <input type="date" id="projectDue" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="projectType">Project Type *</label>
                    <select id="projectType" required>
                        <option value="Design">Design</option>
                        <option value="Web">Web</option>
                        <option value="Both (Design / Web)">Both (Design / Web)</option>
                        <option value="IT">IT</option>
                        <option value="Mobile Development">Mobile Development</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Team Members</label>
                    <div id="teamMembersContainer">
                        <!-- Team members will be added here -->
                    </div>
                    <button type="button" class="btn-secondary" onclick="addTeamMember()" style="margin-top: 10px;">
                        <i class="fas fa-plus"></i> Add Team Member
                    </button>
                </div>

                <div class="form-group">
                    <label>Tasks</label>
                    <div id="tasksContainer">
                        <!-- Tasks will be added here -->
                    </div>
                    <button type="button" class="btn-secondary" onclick="addTask()" style="margin-top: 10px;">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>

                <div class="form-group">
                    <label for="projectNotes">Notes</label>
                    <textarea id="projectNotes"></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="closeProjectModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../auth.js"></script>
    <script src="../projects.js"></script>
    <script src="../modal.js"></script>
    <script>
        // Check authentication
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = '../login.html';
        }

        // Override openProject function for this page to show inline
        function openProject(id) {
            const projects = JSON.parse(localStorage.getItem('prospenProjects')) || {};
            const p = projects[id];
            
            if (!p) return;
            
            // Hide projects grid
            document.getElementById('projectsSection').style.display = 'none';
            
            // Show and populate project view
            showProjectViewInline(id);
        }

        function showProjectViewInline(id) {
            const projects = JSON.parse(localStorage.getItem('prospenProjects')) || {};
            const p = projects[id];
            
            if (!p) return;
            
            const projectView = document.getElementById('project-view');
            const projectContent = document.getElementById('project-content');
            
            // Calculate budget totals
            const totalBudget = calculateTotalBudget ? calculateTotalBudget(p) : 0;
            const spentBudget = calculateSpentBudget ? calculateSpentBudget(p) : 0;
            const remainingBudget = totalBudget - spentBudget;
            
            let html = `
                <div class="grid-layout">
                    <div class="main-col">
                        <div class="section-box">
                            <h2>1. Project Overview: ${p.name}</h2>
                            <p>${p.desc}</p>
                            <table>
                                <tr><th>Lead</th><td>${p.lead}</td><th>Type</th><td>${p.type}</td></tr>
                                <tr><th>Start</th><td>${formatDate(p.start)}</td><th>Status</th><td>${p.status}</td></tr>
                                <tr><th>Last Updated</th><td colspan="3">${p.lastUpdated ? formatDate(p.lastUpdated) + ' by ' + p.lastUpdatedBy : 'Never'}</td></tr>
                            </table>
                        </div>

                        <div class="section-box">
                            <h2>2. Task Allocation</h2>
                            <table>
                                <thead><tr><th>ID</th><th>Task</th><th>Assignee</th><th>Priority</th><th>Due Date</th><th>Status</th></tr></thead>
                                <tbody>
                                    ${p.tasks && p.tasks.length > 0 ? p.tasks.map(t => `
                                        <tr>
                                            <td>${t.id}</td>
                                            <td>${t.name}</td>
                                            <td>${t.who}</td>
                                            <td class="priority-high">${t.prio}</td>
                                            <td>${formatDate(t.due)}</td>
                                            <td>${t.status}</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="6" style="text-align: center;">No tasks added yet</td></tr>'}
                                </tbody>
                            </table>
                        </div>

                        ${p.timeline && p.timeline.length > 0 ? `
                        <div class="section-box">
                            <h2>3. Weekly Timeline & Progress</h2>
                            <table>
                                <thead><tr><th>Week</th><th>Range</th><th>Tasks Planned</th><th>Tasks Completed</th><th>Delays/Risks</th><th>Next Focus</th><th>Updated By</th></tr></thead>
                                <tbody>
                                    ${p.timeline.map(t => `
                                        <tr>
                                            <td>${t.wk}</td>
                                            <td>${t.range}</td>
                                            <td>${t.planned}</td>
                                            <td>${t.comp}</td>
                                            <td>${t.risk}</td>
                                            <td>${t.next}</td>
                                            <td><strong>${t.by || 'Unknown'}</strong></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        ` : ''}

                        <!-- Budget Section -->
                        <div class="section-box">
                            <h2>4. Budget & Resources</h2>
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
                                <div style="background: rgba(56, 189, 248, 0.1); padding: 15px; border-radius: 8px; text-align: center;">
                                    <div style="color: var(--accent); font-size: 0.9rem;">Total Budget</div>
                                    <div style="font-size: 1.5rem; font-weight: bold;">R${totalBudget}</div>
                                </div>
                                <div style="background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px; text-align: center;">
                                    <div style="color: var(--danger); font-size: 0.9rem;">Spent</div>
                                    <div style="font-size: 1.5rem; font-weight: bold;">R${spentBudget}</div>
                                </div>
                                <div style="background: rgba(34, 197, 94, 0.1); padding: 15px; border-radius: 8px; text-align: center;">
                                    <div style="color: var(--success); font-size: 0.9rem;">Remaining</div>
                                    <div style="font-size: 1.5rem; font-weight: bold;">R${remainingBudget}</div>
                                </div>
                            </div>
                            
                            <table>
                                <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th>Type</th>
                                        <th>Amount</th>
                                        <th>Spent</th>
                                        <th>Purchase Date</th>
                                        <th>Receipt</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${p.budget && p.budget.items && p.budget.items.length > 0 ? p.budget.items.map(item => `
                                        <tr>
                                            <td>${item.name}</td>
                                            <td>${item.type || 'One-time'}</td>
                                            <td>R${item.amount || 0}</td>
                                            <td>R${item.spent || 0}</td>
                                            <td>${item.purchaseDate ? formatDate(item.purchaseDate) : '-'}</td>
                                            <td>
                                                ${item.receipt ? `<a href="${item.receipt}" target="_blank" class="small-btn" style="text-decoration: none;"><i class="fas fa-file"></i> View</a>` : '-'}
                                            </td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="6" style="text-align: center;">No budget items added yet</td></tr>'}
                                </tbody>
                            </table>
                            <div style="text-align: right; margin-top: 15px;">
                                <button class="small-btn" onclick="openBudgetModal('${p.id}')" style="padding: 8px 16px;">
                                    <i class="fas fa-plus"></i> Add Budget Item
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="side-col">
                        <div class="section-box">
                            <h2>5. Team Roles</h2>
                            ${p.members && p.members.length > 0 ? p.members.map(m => `
                                <div class="team-member">
                                    <b>${m.name}</b>
                                    <i>${m.role}</i>
                                    <div style="font-size:0.8rem; margin-top:5px;">${m.resp}</div>
                                    <div style="color:var(--accent); font-size:0.8rem;">${m.contact}</div>
                                </div>
                            `).join('') : '<p>No team members added yet</p>'}
                        </div>
                        <div class="section-box">
                            <h2>6. Notes</h2>
                            <p>${p.notes || 'No notes available.'}</p>
                        </div>
                    </div>
                </div>
            `;
            
            if (projectContent) {
                projectContent.innerHTML = html;
            }
            
            projectView.classList.add('show');
        }

        function closeProjectView() {
            document.getElementById('project-view').classList.remove('show');
            document.getElementById('projectsSection').style.display = 'block';
        }

        // Helper function for date formatting (copied from projects.js to ensure availability)
        function formatDate(dateStr) {
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            } catch (e) {
                return 'Invalid date';
            }
        }

        // Helper function to calculate total budget
        function calculateTotalBudget(project) {
            if (!project.budget || !project.budget.items) return 0;
            return project.budget.items.reduce((total, item) => total + (item.amount || 0), 0);
        }

        // Helper function to calculate spent budget
        function calculateSpentBudget(project) {
            if (!project.budget || !project.budget.items) return 0;
            return project.budget.items.reduce((total, item) => total + (item.spent || 0), 0);
        }

        // Function to open budget modal
        function openBudgetModal(projectId) {
            const name = prompt("Enter budget item name (e.g., SEO Plugin):");
            if (!name) return;
            
            const type = prompt("Enter payment type (One-time/Monthly):", "One-time");
            if (!type) return;
            
            const amount = parseFloat(prompt("Enter total amount (R):", "0"));
            if (isNaN(amount)) return;
            
            const spent = parseFloat(prompt("Enter amount spent (R):", "0"));
            if (isNaN(spent)) return;
            
            const purchaseDate = prompt("Enter purchase date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            if (!purchaseDate) return;
            
            const receipt = prompt("Enter receipt URL or path (optional):", "");
            
            const projects = JSON.parse(localStorage.getItem('prospenProjects')) || {};
            const project = projects[projectId];
            
            if (!project.budget) {
                project.budget = { items: [] };
            }
            
            project.budget.items.push({
                name: name,
                type: type,
                amount: amount,
                spent: spent,
                purchaseDate: purchaseDate,
                receipt: receipt || null
            });
            
            localStorage.setItem('prospenProjects', JSON.stringify(projects));
            
            showProjectViewInline(projectId);
            showCustomModal('Success', 'Budget item added successfully!', 'success');
        }

        // Initialize projects
        document.addEventListener('DOMContentLoaded', function() {
            initProjects();
            renderAllProjects();
            
            // Check if we need to open a project view (from localStorage)
            const projectId = localStorage.getItem('currentProjectView');
            if (projectId) {
                setTimeout(() => {
                    openProject(projectId);
                    localStorage.removeItem('currentProjectView');
                }, 100);
            }
            
            // Countdown timer
            setInterval(() => {
                const projects = JSON.parse(localStorage.getItem('prospenProjects')) || {};
                Object.values(projects).forEach(project => {
                    const dueDate = new Date(project.due);
                    const now = new Date();
                    const diff = dueDate - now;
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    
                    const countdownElement = document.querySelector(`[onclick*="${project.id}"] .countdown`);
                    if (countdownElement) {
                        if (!isNaN(days)) {
                            if (days > 0) {
                                countdownElement.textContent = `${days} Days Remaining`;
                            } else if (days === 0) {
                                countdownElement.textContent = "Due Today!";
                            } else {
                                countdownElement.textContent = `${Math.abs(days)} Days Overdue`;
                            }
                        }
                    }
                });
            }, 60000);
        });
    </script>
</body>
</html>
